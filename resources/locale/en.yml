donk-aigc-collectibles:
  admin:
    settings:
      title: AIGC Collectibles Settings

      # AIGC API settings
      aigc_heading: AIGC Image Generation
      aigc_api_endpoint_label: AIGC API Endpoint
      aigc_api_endpoint_help: The base URL for the image generation API (e.g. OpenAI DALL-E or Stable Diffusion compatible endpoint).
      aigc_api_key_label: AIGC API Key
      aigc_api_key_help: Secret key used to authenticate with the AIGC image generation service.
      aigc_model_label: AIGC Model
      aigc_model_help: The model identifier to use for image generation (e.g. dall-e-3, stable-diffusion-xl).
      aigc_default_prompt_label: Default Prompt Template
      aigc_default_prompt_help: "Base prompt template for collectible generation. Use {rarity} as a placeholder for the rarity tier."

      # IPFS settings
      ipfs_heading: IPFS Storage
      ipfs_api_endpoint_label: IPFS API Endpoint
      ipfs_api_endpoint_help: The HTTP API endpoint for your IPFS node or Pinata API (e.g. https://api.pinata.cloud).
      ipfs_api_key_label: IPFS API Key
      ipfs_api_key_help: API key or bearer token for authenticating with your IPFS pinning service.
      ipfs_gateway_url_label: IPFS Gateway URL
      ipfs_gateway_url_help: "The public gateway URL for serving IPFS content (e.g. https://gateway.pinata.cloud/ipfs/). Must end with /."

      # Blockchain settings
      blockchain_heading: Blockchain & NFT
      blockchain_enabled_label: Enable NFT Minting
      blockchain_rpc_url_label: Blockchain RPC URL
      blockchain_rpc_url_help: JSON-RPC endpoint for the EVM chain (e.g. http://127.0.0.1:8545 for local Hardhat/Ganache).
      blockchain_contract_address_label: NFT Contract Address
      blockchain_contract_address_help: Deployed ERC-721 CollectibleNFT contract address.
      blockchain_private_key_label: Minting Wallet Private Key
      blockchain_private_key_help: Private key of the wallet authorized to mint NFTs. Keep this secret.
      blockchain_chain_id_label: Chain ID
      blockchain_chain_id_help: The chain ID of the target EVM network (e.g. 31337 for Hardhat local).

      # Check-in settings
      checkin_heading: Daily Check-in
      checkin_reward_amount_label: Check-in Reward Amount
      checkin_reward_amount_help: Number of blind boxes awarded per daily check-in.

      # Rarity settings
      rarity_heading: Rarity Weights
      rarity_help: "Relative weights for each rarity tier. These do not need to sum to 100 -- they are normalized automatically."
      rarity_common_weight_label: Common Weight
      rarity_rare_weight_label: Rare Weight
      rarity_epic_weight_label: Epic Weight
      rarity_legendary_weight_label: Legendary Weight

      # Feature toggles
      features_heading: Feature Toggles
      trading_enabled_label: Enable P2P Trading
      web3_enabled_label: Enable Web3 Wallet Binding
      aigc_enabled_label: Enable AIGC Generation

      # Submit
      submit_button: Save Settings

      # WebSocket settings
      ws_url_label: WebSocket URL
      ws_url_help: WebSocket server URL for real-time notifications (optional).

