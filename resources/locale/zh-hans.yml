donk-aigc-collectibles:
  admin:
    settings:
      title: AIGC 数字藏品设置

      # AIGC API 设置
      aigc_heading: AIGC 图像生成
      aigc_api_endpoint_label: AIGC API 端点
      aigc_api_endpoint_help: 图像生成 API 的基础 URL（如 OpenAI DALL-E 或 Stable Diffusion 兼容端点）。
      aigc_api_key_label: AIGC API 密钥
      aigc_api_key_help: 用于验证 AIGC 图像生成服务的密钥。
      aigc_model_label: AIGC 模型
      aigc_model_help: 用于图像生成的模型标识符（如 dall-e-3、stable-diffusion-xl）。
      aigc_default_prompt_label: 默认提示词模板
      aigc_default_prompt_help: 藏品生成的基础提示词模板。使用 {rarity} 作为稀有度等级的占位符。

      # IPFS 设置
      ipfs_heading: IPFS 存储
      ipfs_api_endpoint_label: IPFS API 端点
      ipfs_api_endpoint_help: IPFS 节点或 Pinata API 的 HTTP API 端点（如 https://api.pinata.cloud）。
      ipfs_api_key_label: IPFS API 密钥
      ipfs_api_key_help: 用于验证 IPFS 固定服务的 API 密钥或 Bearer Token。
      ipfs_gateway_url_label: IPFS 网关 URL
      ipfs_gateway_url_help: 用于提供 IPFS 内容的公共网关 URL（如 https://gateway.pinata.cloud/ipfs/）。必须以 / 结尾。

      # 区块链设置
      blockchain_heading: 区块链与 NFT
      blockchain_enabled_label: 启用 NFT 铸造
      blockchain_enabled_help: 启用或禁用区块链上的 NFT 铸造功能。
      blockchain_rpc_url_label: 区块链 RPC URL
      blockchain_rpc_url_help: EVM 链的 JSON-RPC 端点（如 http://127.0.0.1:8545 用于本地 Hardhat/Ganache）。
      blockchain_contract_address_label: NFT 合约地址
      blockchain_contract_address_help: 已部署的 ERC-721 CollectibleNFT 合约地址。
      blockchain_private_key_label: 铸造钱包私钥
      blockchain_private_key_help: 授权铸造 NFT 的钱包私钥。请妥善保管。
      blockchain_chain_id_label: 链 ID
      blockchain_chain_id_help: 目标 EVM 网络的链 ID（如 31337 用于 Hardhat 本地网络）。

      # 签到设置
      checkin_heading: 每日签到
      checkin_reward_amount_label: 签到奖励数量
      checkin_reward_amount_help: 每次每日签到奖励的盲盒数量。
      checkin_reward_label: 签到奖励数量
      checkin_reward_help: 每次每日签到奖励的盲盒数量。

      # 稀有度设置
      rarity_heading: 稀有度权重
      rarity_help: 各稀有度等级的相对权重。无需加总为 100，系统会自动归一化。
      rarity_common_weight_label: 普通权重
      rarity_rare_weight_label: 稀有权重
      rarity_epic_weight_label: 史诗权重
      rarity_legendary_weight_label: 传说权重
      rarity_common_label: 普通权重
      rarity_rare_label: 稀有权重
      rarity_epic_label: 史诗权重
      rarity_legendary_label: 传说权重
      rarity_weights_help: 各稀有度等级的相对权重，系统会自动归一化。

      # 功能开关
      features_heading: 功能开关
      trading_enabled_label: 启用 P2P 交易
      web3_enabled_label: 启用 Web3 钱包绑定
      aigc_enabled_label: 启用 AIGC 生成
      aigc_enabled_help: 启用或禁用 AIGC 图像生成功能。

      # admin.ts registerSetting 使用的键
      aigc_endpoint_label: AIGC API 端点
      aigc_prompt_template_label: 默认提示词模板
      aigc_prompt_template_help: 藏品生成的基础提示词模板。使用 {rarity} 作为占位符。
      ipfs_endpoint_label: IPFS API 端点
      ipfs_gateway_label: IPFS 网关 URL
      ws_url_label: WebSocket URL
      ws_url_help: 用于实时通知的 WebSocket 服务器 URL（可选）。

      # 分区标题
      section_aigc: AIGC 图像生成
      section_ipfs: IPFS 存储
      section_blockchain: 区块链与 NFT
      section_rarity: 稀有度权重

      # 提交
      submit_button: 保存设置

