donk-aigc-collectibles:
  admin:
    settings:
      title: AIGC 数字藏品设置

      # AIGC API 设置
      aigc_heading: AIGC 图像生成
      aigc_api_endpoint_label: AIGC API 端点
      aigc_api_endpoint_help: 图像生成 API 的基础 URL（如 OpenAI DALL-E 或 Stable Diffusion 兼容端点）。
      aigc_api_key_label: AIGC API 密钥
      aigc_api_key_help: 用于验证 AIGC 图像生成服务的密钥。
      aigc_model_label: AIGC 模型
      aigc_model_help: 用于图像生成的模型标识符（如 dall-e-3、stable-diffusion-xl）。
